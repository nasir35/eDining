databases:
  - name: edining-db
    plan: free
    databaseName: edining
    user: edining

services:
  - type: web
    name: edining-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edining-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: System Super Admin
      - key: ADMIN_PHONE
        value: "01711223344"
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: DEFAULT_HALL_NAME
        value: Main Dining Hall
      - key: INIT_HALLS
        value: "1"
      - key: INIT_USERS
        value: "0"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: APP_THREADPOOL_SIZE
        value: "100"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: BKASH_WEBHOOK_SECRET
        generateValue: true

